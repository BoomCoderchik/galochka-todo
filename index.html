<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="Галочка — личный список задач с сохранением в браузере.">
  <title>Галочка — список задач</title>
  <link rel="icon" href="./check.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header frame">
    <span class="brand"><img src="./check.svg" alt="" width="32" height="32"> Галочка</span>
    <time id="date"></time>
  </header>

  <main class="frame workspace">
    <div class="intro">
      <h1>Мои задачи</h1>
      <p>Запишите то, что хочется сделать.<br>Вычеркните, когда готово.</p>
      <section class="summary" id="summary" aria-labelledby="progress-label" hidden>
        <div class="summary-line">
          <span id="progress-label">Выполнено</span>
          <strong id="progress-count"></strong>
        </div>
        <progress id="progress" aria-labelledby="progress-label"></progress>
      </section>
    </div>

    <section class="sheet" aria-label="Список задач">
      <form id="task-form">
        <label class="sr-only" for="task-title">Новая задача</label>
        <input id="task-title" name="title" type="text" required maxlength="240" autocomplete="off"
          placeholder="Новая задача…" aria-describedby="form-error">
        <button class="add" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Добавить
        </button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>
      <p id="storage-error" class="error" role="alert" hidden></p>
      <div class="filters" role="group" aria-label="Показать задачи">
        <button type="button" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" data-filter="active" aria-pressed="false">В работе</button>
        <button type="button" data-filter="done" aria-pressed="false">Готово</button>
      </div>
      <ul id="tasks" class="tasks" aria-label="Задачи"></ul>
      <div id="empty" class="empty" hidden>
        <strong id="empty-title"></strong>
        <p id="empty-copy"></p>
      </div>
      <div class="paper-end" aria-hidden="true"></div>
      <p id="announcement" class="sr-only" role="status"></p>
    </section>
    <noscript>Включите JavaScript, чтобы пользоваться списком.</noscript>
  </main>

  <footer class="frame site-footer">Задачи сохраняются в этом браузере.</footer>

  <template id="task-template">
    <li class="task">
      <label class="task-label">
        <input type="checkbox">
        <span class="task-title"></span>
      </label>
      <button class="delete" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/>
        </svg>
      </button>
    </li>
  </template>
</body>
</html>
